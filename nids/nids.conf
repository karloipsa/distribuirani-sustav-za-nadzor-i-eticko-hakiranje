# NIDS mrežna konfiguracija
INTERFACE="enp0s8"
PROTECTED_NET="192.168.100.0/24"

# NIDS control kanal
CONTROL_IP="192.168.100.254"
CONTROL_PORT=5001

# Centralni server
SERVER_IP="192.168.100.1"
SERVER_PORT=5000

# TLS enrollment
TLS_CA_PORT=5002

# Runtime TLS
TLS_ENABLE=1
TLS_CA="./ssl/ca-cert.pem"
TLS_CERT="./ssl/nids-cert.pem"
TLS_KEY="./ssl/nids-key.pem"

# ICMP flood detekcija
ICMP_WINDOW=5
ICMP_THRESHOLD=20
ALERT_COOLDOWN=10

# Emergency fail-safe
EMERGENCY_BLOCK_ENABLE=1
EMERGENCY_BLOCK_TTL=60
SERVER_CHECK_RETRIES=2
SERVER_CHECK_WAIT=1